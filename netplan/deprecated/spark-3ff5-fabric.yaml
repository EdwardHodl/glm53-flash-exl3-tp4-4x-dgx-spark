# spark-3ff5.local — fire triangle fabric (VERIFIED wiring 2026-09-21)
# link1 -> spark-e116 : enp1s0f1np1 = 10.10.1.3/24
# link3 -> gx10-2ca4  : enp1s0f0np0 = 10.10.2.3/24
# Deployed to /etc/netplan/50-qfsp-static.yaml (root:root 600). Apply: sudo netplan apply
# 3ff5 had NO fabric netplan before this (HCAs appeared only once the cables were
# plugged); this file is new.
network:
  version: 2
  ethernets:
    enp1s0f0np0:
      mtu: 4092
      addresses:
        - 10.10.2.3/24
      nameservers:
        addresses: []
      optional: true
    enp1s0f1np1:
      mtu: 4092
      addresses:
        - 10.10.1.3/24
      nameservers:
        addresses: []
      optional: true
