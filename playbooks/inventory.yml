# fire — DGX Spark 3-node triangle inventory (GLM-5.3-Flash-EXL3 TP=3)
#
# spark-e116.local  rank 0  head  — torch.dist master + OpenAI API :8888
# gx10-2ca4.local   rank 1  worker (headless)
# spark-3ff5.local  rank 2  worker (headless)
#
# Fabric: QSFP direct-attach triangle, VERIFIED BY PROBE 2026-09-21.
# Each node exposes 2 CX7 cages (4 netdevs — each cage answers on 2 PCI paths).
# Discovered adjacencies (MAC-verified, all links ping OK):
#   link1: e116 enp1s0f0np0 (10.10.1.1) <-> 3ff5 enp1s0f1np1 (10.10.1.3)
#   link2: e116 enp1s0f1np1 (10.10.0.1) <-> 2ca4 enp1s0f0np0 (10.10.0.2)
#   link3: 2ca4 enp1s0f1np1 (10.10.2.2) <-> 3ff5 enp1s0f0np0 (10.10.2.3)
# NOTE: this is NOT f1<->f1 — the cages are cross-connected job-by-job; the old
# 10.10.0.1/10.10.0.2 pair used to be e116-f1<->2ca4-f1 and no longer is.
#
# RoCE v2 IPv4 GID index for every fabric port on all 3 nodes is 3 (verified),
# so NCCL_IB_GID_INDEX=3 covers both HCAs on every node.
# lan_ip is the management/SSH + torch.dist master network (192.168.1.x).

all:
  children:
    fire_nodes:
      hosts:
        spark-e116.local:
          ansible_user: spark
          node_rank: 0
          role: head
          lan_ip: 192.168.1.6
          fabric_ips:
            - 10.10.1.1      # link1 -> spark-3ff5
            - 10.10.0.1      # link2 -> gx10-2ca4
          fabric_ifs:
            - enp1s0f0np0
            - enp1s0f1np1
          fabric_hcas:
            - rocep1s0f0
            - rocep1s0f1

        gx10-2ca4.local:
          ansible_user: spark
          ansible_become: false
          node_rank: 1
          role: worker
          lan_ip: 192.168.1.31
          fabric_ips:
            - 10.10.0.2      # link2 -> spark-e116
            - 10.10.2.2      # link3 -> spark-3ff5
          fabric_ifs:
            - enp1s0f0np0
            - enp1s0f1np1
          fabric_hcas:
            - rocep1s0f0
            - rocep1s0f1

        spark-3ff5.local:
          ansible_user: spark
          ansible_private_key_file: /home/flowai/.ssh/spark_agent_key
          ansible_connection: ssh
          ansible_ssh_common_args: "-o StrictHostKeyChecking=accept-new"
          node_rank: 2
          role: worker
          lan_ip: 192.168.1.28
          fabric_ips:
            - 10.10.2.3      # link3 -> gx10-2ca4
            - 10.10.1.3      # link1 -> spark-e116
          fabric_ifs:
            - enp1s0f0np0
            - enp1s0f1np1
          fabric_hcas:
            - rocep1s0f0
            - rocep1s0f1

    fire_heads:
      hosts:
        spark-e116.local:

    fire_workers:
      hosts:
        gx10-2ca4.local:
        spark-3ff5.local:
